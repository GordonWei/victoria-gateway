# victoria-gateway config. Mounted read-only at /etc/victoria-gateway/config.yaml —
# see docker-compose.snippet.yml. Fill in every REPLACE marker before use.

listen_addr: ":8090"

# Optional. Requires HTTP Basic Auth on /webhook/alertmanager when set —
# anyone who can reach this port can otherwise trigger LLM/cloud calls and
# file tracker issues on your behalf, so set this if the port is reachable
# from anywhere you don't fully trust. Configure the same username/password
# on Alertmanager's webhook_configs (see deploy/alertmanager_receiver_example.md).
# webhook_auth:
#   username: "alertmanager"
#   password: "REPLACE-a-real-secret"

loki:
  endpoint: "http://loki:3100"   # Loki's service name on the same docker network
  lookback_sec: 300
  limit: 200

summarizer:
  # OpenAI-compatible endpoint (LM Studio, Ollama, vLLM, etc.). If it's on a
  # different host than this container, use its real LAN IP — it won't be
  # reachable by container/service name unless it's on the same docker network.
  endpoint: "http://REPLACE-llm-host:1234"
  model: "REPLACE-model-name"
  # Optional. Only needed if `endpoint` above is a real cloud OpenAI-compatible
  # API rather than an unauthenticated local server — e.g. running the primary
  # summarizer itself against Gemini's OpenAI-compatibility layer
  # (endpoint: "https://generativelanguage.googleapis.com/v1beta/openai",
  # model: "gemini-2.5-flash") instead of a local model, which can be worth
  # doing if the local backend is too slow/unreliable and you'd rather every
  # alert go straight to cloud instead of only escalated ones (see Triage).
  # api_key: "REPLACE-api-key"

# Optional. Omit this whole section to run local-only, exactly as before —
# nothing below changes behavior unless escalation.always_cloud is also set
# or the local model's own reply asks to escalate (see README's Triage
# section).
# cloud:
#   provider: "gemini"   # optional, defaults to "gemini"; "anthropic" also supported
#   endpoint: ""   # optional; each provider has its own default
#   api_key: "REPLACE-gemini-api-key"
#   model: "gemini-2.5-flash"

# Optional. Alert names listed here always get re-analyzed by `cloud`
# regardless of what the local model's own confidence says — use this for
# alerts you already know are complex/sensitive in your environment.
# escalation:
#   always_cloud:
#     - "SomeAlwaysComplexAlert"
#   # Optional spend guardrail: caps escalations to `cloud` at this many
#   # per rolling hour. 0 (default) is unlimited. Nothing else bounds
#   # cloud API cost if the local model's escalate signal misfires
#   # broadly or always_cloud matches more than intended — an alert that
#   # hits the cap stays on the local result instead of failing.
#   max_per_hour: 20

# Optional. Retrieves past incidents similar to a new alert and adds them
# to the prompt as reference context. Requires a Postgres database with the
# pgvector extension installed (see pkg/rag/schema.sql) and an
# OpenAI-compatible /v1/embeddings endpoint. Every analyzed alert is
# captured as a Pending record automatically; only Confirmed records are
# ever retrieved — see README for how a record gets confirmed (`note --id`
# by hand, or automatically via the optional gitea block below + `sync`).
# rag:
#   enabled: false
#   postgres_dsn: "postgres://REPLACE-user:REPLACE-pass@REPLACE-host:5432/REPLACE-db"
#   embedding_endpoint: "http://REPLACE-llm-host:1234"
#   embedding_model: "bge-m3"
#   # embedding_api_key: ""   # optional; only if embedding_endpoint requires auth
#   top_k: 3
#   # Similar-incident references in notifications (on by default when RAG
#   # is on): past confirmed incidents with cosine similarity >= the
#   # threshold get linked at the bottom of each push — issue URL when the
#   # record has one, otherwise this service's own /incidents/{id} page.
#   # show_similar_in_notification: true
#   # similarity_threshold: 0.75
#   # public_base_url: "http://REPLACE-host:8090"   # what /incidents links are prefixed with
#   # Optional. Files an issue per analyzed alert on whichever tracker you
#   # configure; `victoria-gateway sync` (run on a schedule) reads closed
#   # issues' last comment back in as the resolution. Omit both to skip
#   # auto-filing — capture still happens, confirmation just has to be done
#   # via `note --id` instead. Configure at most one of gitea/github —
#   # having both set is a startup error.
#   gitea:
#     endpoint: "https://REPLACE-gitea-instance"
#     token: "REPLACE-gitea-token"   # needs write:issue scope
#     owner: "REPLACE-owner"
#     repo: "victoria-gateway-incidents"   # a dedicated repo, not the code repo
#   # github:
#   #   endpoint: ""   # optional, defaults to https://api.github.com (set for GitHub Enterprise Server)
#   #   token: "REPLACE-github-token"   # needs the "issues" repo permission
#   #   owner: "REPLACE-owner"
#   #   repo: "victoria-gateway-incidents"   # a dedicated repo, not the code repo

telegram:
  # Push each alert's LLM summary to this chat. Leave bot_token empty to
  # disable — the summary is still computed either way, it just won't be
  # pushed anywhere (only visible in the webhook's HTTP response body,
  # which nothing reads in production).
  bot_token: "REPLACE-bot-token"
  chat_id: 0

# Optional. Respond 202 immediately and analyze in the background instead of
# holding Alertmanager's webhook connection until every analysis finishes.
# Recommended (true) for any deployment fronted by a real Alertmanager —
# its own webhook timeout is far shorter than a cloud escalation, so sync
# mode makes it time out and redeliver every slow alert. Leave false only
# if you rely on reading full results from the response body via curl.
webhook_async: true

# Optional. How long a SIGTERM'd process waits for in-flight analyses to
# finish before exiting anyway (seconds; 0 = the 300s default). Pair it
# with stop_grace_period on the compose service so Docker doesn't SIGKILL
# the container mid-drain.
# shutdown_grace_sec: 300

# Optional. Multi-channel notification routing. Omit this whole block and
# the `telegram` block above stays the single destination for everything —
# exactly the old behavior. With this block, alerts are routed to the
# first route whose matchers all match the alert's labels (same glob
# syntax as maintenance_windows); a `default: true` route (last) catches
# the rest. If the top-level `telegram` block is also set and no route is
# marked default, it becomes the implicit default route.
# notifications:
#   channels:
#     - name: "critical-ops"
#       type: telegram
#       bot_token: "REPLACE-bot-token"
#       chat_id: 0
#     - name: "itsm-webhook"
#       type: webhook
#       url: "http://REPLACE-itsm/api/v1/alerts"
#       # method: POST            # optional, defaults to POST
#       # headers:                # optional, sent verbatim
#       #   Authorization: "Bearer REPLACE"
#   routes:
#     - matchers:
#         severity: critical
#       channels: ["critical-ops", "itsm-webhook"]
#     - default: true
#       channels: ["critical-ops"]
