# orch-gateway config. Mounted read-only at /etc/orch-gateway/config.yaml —
# see docker-compose.snippet.yml. Fill in every REPLACE marker before use.

listen_addr: ":8090"

loki:
  endpoint: "http://loki:3100"   # Loki's service name on the same docker network
  lookback_sec: 300
  limit: 200

summarizer:
  # OpenAI-compatible endpoint (LM Studio, Ollama, vLLM, etc.). If it's on a
  # different host than this container, use its real LAN IP — it won't be
  # reachable by container/service name unless it's on the same docker network.
  endpoint: "http://REPLACE-llm-host:1234"
  model: "REPLACE-model-name"

# Optional. Omit this whole section to run local-only, exactly as before —
# nothing below changes behavior unless escalation.always_cloud is also set
# or the local model's own reply asks to escalate (see README's Triage
# section).
# cloud:
#   provider: "gemini"   # optional, defaults to "gemini"; "anthropic" also supported
#   endpoint: ""   # optional; each provider has its own default
#   api_key: "REPLACE-gemini-api-key"
#   model: "gemini-2.5-flash"

# Optional. Alert names listed here always get re-analyzed by `cloud`
# regardless of what the local model's own confidence says — use this for
# alerts you already know are complex/sensitive in your environment.
# escalation:
#   always_cloud:
#     - "SomeAlwaysComplexAlert"

# Optional. Retrieves past incidents similar to a new alert and adds them
# to the prompt as reference context. Requires a Postgres database with the
# pgvector extension installed (see pkg/rag/schema.sql) and an
# OpenAI-compatible /v1/embeddings endpoint. Starts empty — see the `note`
# CLI subcommand in README for how records get in.
# rag:
#   enabled: false
#   postgres_dsn: "postgres://REPLACE-user:REPLACE-pass@REPLACE-host:5432/REPLACE-db"
#   embedding_endpoint: "http://REPLACE-llm-host:1234"
#   embedding_model: "bge-m3"
#   top_k: 3

telegram:
  # Push each alert's LLM summary to this chat. Leave bot_token empty to
  # disable — the summary is still computed either way, it just won't be
  # pushed anywhere (only visible in the webhook's HTTP response body,
  # which nothing reads in production).
  bot_token: "REPLACE-bot-token"
  chat_id: 0
